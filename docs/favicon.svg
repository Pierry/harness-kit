<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- harness-kit mark: a gated pipeline, three nodes flowing into a gold endpoint (merged PR) -->
  <defs>
    <linearGradient id="hk-line" x1="6" y1="16" x2="26" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fcc04a"/>
    </linearGradient>
    <linearGradient id="hk-gold" x1="22" y1="11" x2="26" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcc04a"/>
      <stop offset="1" stop-color="#e0a020"/>
    </linearGradient>
    <style>
      .tile { fill: #0b0d11; stroke: #2b323e; }
      @media (prefers-color-scheme: light) {
        .tile { fill: #ffffff; stroke: #e6e3ef; }
      }
    </style>
  </defs>
  <rect class="tile" x="1" y="1" width="30" height="30" rx="7.5" stroke-width="1.2"/>
  <path d="M7 16 H25" stroke="url(#hk-line)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="7" cy="16" r="2.6" fill="#0b0d11" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="16" cy="16" r="2.6" fill="#0b0d11" stroke="#c4b3ff" stroke-width="2"/>
  <circle cx="24.5" cy="16" r="4" fill="url(#hk-gold)"/>
</svg>
